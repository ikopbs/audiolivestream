<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>Audio Livestream Prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700;800&display=swap">
<style>
/* PBS Sans from the PBS font server (v1.2). Figtree is only a fallback where it can’t load (e.g. the claude.ai preview). */
@font-face{font-family:'PBS Sans';font-weight:400;font-style:normal;src:url('https://www-tc.pbs.org/pbsfonts/v1.2/PBSSans.woff2') format('woff2'),url('https://www-tc.pbs.org/pbsfonts/v1.2/PBSSans.woff') format('woff');font-display:swap}
@font-face{font-family:'PBS Sans';font-weight:400;font-style:italic;src:url('https://www-tc.pbs.org/pbsfonts/v1.2/PBSSans-It.woff2') format('woff2'),url('https://www-tc.pbs.org/pbsfonts/v1.2/PBSSans-It.woff') format('woff');font-display:swap}
@font-face{font-family:'PBS Sans';font-weight:500;font-style:normal;src:url('https://www-tc.pbs.org/pbsfonts/v1.2/PBSSans-Medium.woff2') format('woff2'),url('https://www-tc.pbs.org/pbsfonts/v1.2/PBSSans-Medium.woff') format('woff');font-display:swap}
@font-face{font-family:'PBS Sans';font-weight:700;font-style:normal;src:url('https://www-tc.pbs.org/pbsfonts/v1.2/PBSSans-Bold.woff2') format('woff2'),url('https://www-tc.pbs.org/pbsfonts/v1.2/PBSSans-Bold.woff') format('woff');font-display:swap}
@font-face{font-family:'PBS Sans';font-weight:700;font-style:italic;src:url('https://www-tc.pbs.org/pbsfonts/v1.2/PBSSans-Bold-It.woff2') format('woff2'),url('https://www-tc.pbs.org/pbsfonts/v1.2/PBSSans-Bold-It.woff') format('woff');font-display:swap}
@font-face{font-family:'PBS Sans';font-weight:900;font-style:normal;src:url('https://www-tc.pbs.org/pbsfonts/v1.2/PBSSans-Black.woff2') format('woff2'),url('https://www-tc.pbs.org/pbsfonts/v1.2/PBSSans-Black.woff') format('woff');font-display:swap}
/* Layout: a review toolbar over a "device" that holds one site page plus the shared bottom player; a notes drawer on the right holds options and rationale. */
:root{
  color-scheme: dark;
  /* dotorg-next tokens (components/includes/_colors.scss) */
  --midnight:#000525; --onyx:#040613; --paynes:#171b33; --charcoal:#1e2030;
  --pbs-blue:#2638c4; --medium-blue:#0f1e8c; --navy:#0a145a;
  --blue-gray:#3d4a6b; --slate:#5c6e85; --pebble:#94a1b2; --moon:#c0cbda; --rain:#d5dde7; --fog:#eef0f5; --cloud:#f6f8fa; --white:#fff;
  --teal:#48d3cd; --yellow:#ffcf00; --red:#d6383a; --coral:#fe704e; --purple:#4e05ac; --light-blue:#486cd8;
  /* MultiLivestream schedule tokens */
  --ch-btn:#1f2849; --ch-btn-sel:#0f1e8c; --listing:rgba(61,74,107,.5); --listing-progress:#313d5b; --listing-sel:#0a145a; --listing-past:#303c5a;
  /* PBS Sans first; Figtree is the fallback */
  --sans:'PBS Sans','Figtree','Helvetica Neue',Helvetica,Arial,sans-serif;
  --dur:.3s;
  /* prototype chrome */
  --pt-bg:#05081c; --pt-line:#1c2346; --pt-text:#dfe5f2; --pt-sub:#8c98b3; --pt-card:#0b1030;
  --bar-h:0px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--pt-bg);color:var(--pt-text);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
img{max-width:100%}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ===== Prototype toolbar ===== */
.proto{height:100%;display:grid;grid-template-rows:auto 1fr}
.pt{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--pt-line);background:var(--pt-bg);position:relative;z-index:50}
.pt-brand{display:flex;flex-direction:column;line-height:1.15;margin-right:6px}
.pt-brand b{font-size:14px;font-weight:800;letter-spacing:.01em}
.pt-brand span{font-size:11px;color:var(--pt-sub)}
.seg{display:inline-flex;background:#0e1436;border:1px solid var(--pt-line);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:999px;font-size:12.5px;font-weight:700;color:var(--pt-sub);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--fog);color:var(--midnight)}
.seg button:hover:not([aria-pressed="true"]){color:var(--pt-text)}
.pt-spacer{flex:1}
.pt-chip{font-size:11.5px;color:var(--pt-sub);display:inline-flex;align-items:center;gap:6px}
.pt-chip i{width:8px;height:8px;border-radius:50%;background:var(--slate);display:inline-block}
.pt-chip.on i{background:var(--teal);box-shadow:0 0 0 3px rgba(72,211,205,.2)}
.pt-btn{border:1px solid var(--pt-line);background:#0e1436;border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:700;cursor:pointer}
.pt-btn[aria-pressed="true"]{border-color:var(--teal);color:var(--teal)}

.workspace{display:grid;grid-template-columns:1fr auto;min-height:0}
.stage{min-width:0;min-height:0;display:flex;justify-content:center;align-items:stretch;overflow:hidden;background:var(--pt-bg)}
.stage.mobile{align-items:center;padding:16px;background:radial-gradient(circle at 50% 40%,#111a44 0,var(--pt-bg) 70%)}

/* ===== Device + site ===== */
.device{position:relative;width:100%;height:100%;container:dev / inline-size;background:var(--midnight);overflow:hidden;color:var(--fog)}
.stage.mobile .device{width:390px;max-width:100%;height:min(844px,100%);border-radius:36px;border:10px solid #1a1f38;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.viewport{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding-bottom:var(--bar-h)}
.viewport::-webkit-scrollbar{width:10px}.viewport::-webkit-scrollbar-thumb{background:#2b3459;border-radius:8px}
.site{--si:64px;--sb:56px;min-height:100%;font-family:var(--sans);background:var(--midnight)}
@container dev (max-width:1139px){.site{--si:32px;--sb:44px}}
@container dev (max-width:767px){.site{--si:16px;--sb:36px}}

/* ===== PBS.org nav (Navigation component) ===== */
.nav{position:sticky;top:0;z-index:20;background:var(--midnight);border-top:8px solid var(--pbs-blue)}
.nav-in{display:flex;align-items:center;gap:22px;height:64px;padding-inline:var(--si)}
.nav-logo svg{height:36px;width:auto;display:block}
.nav a,.nav .lnk{color:var(--fog);text-decoration:none;font-size:15px;font-weight:500;display:inline-flex;align-items:center;gap:6px;cursor:pointer;background:none;border:0;padding:0}
.nav .lnk.cur{font-weight:700}
.nav .dot{width:7px;height:7px;border-radius:50%;background:var(--fog)}
.nav-l,.nav-r{display:flex;align-items:center;gap:22px}
.nav-r{margin-left:auto}
.nav-station img{height:30px;display:block}
.signin{border:1px solid var(--fog);border-radius:999px;padding:5px 14px;font-size:13px;font-weight:700}
.nav svg.ic{width:15px;height:15px;fill:var(--fog)}
@container dev (max-width:1023px){.nav-l .hide-md,.nav-r .hide-md{display:none}.nav-in{gap:14px}.nav-l,.nav-r{gap:14px}}
@container dev (max-width:767px){.nav{border-top-width:4px}.nav-in{height:48px}.nav-logo svg{height:26px}.nav-station img{height:20px}.nav-l .hide-sm,.nav-r .hide-sm{display:none}.signin{padding:4px 10px;font-size:12px}}
.subnav{display:flex;gap:28px;padding:4px var(--si) 10px;font-size:13px;color:var(--fog);overflow:hidden;white-space:nowrap}
.subnav span:first-child{border-bottom:2px solid var(--fog);padding-bottom:6px;font-weight:700}
@container dev (max-width:767px){.subnav{display:none}}

/* ===== Home hero ===== */
.hero{position:relative;min-height:440px;display:flex;align-items:flex-end;padding:0 var(--si) 48px;overflow:hidden}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,5,37,.92) 0,rgba(0,5,37,.4) 55%,rgba(0,5,37,0) 80%),linear-gradient(0deg,var(--midnight) 0,rgba(0,5,37,0) 40%)}
.hero-c{position:relative;z-index:1;max-width:460px}
.hero-show{font-size:34px;font-weight:800;line-height:1;letter-spacing:-.01em;text-transform:uppercase;margin:0 0 12px}
.hero h2{font-size:20px;line-height:1.3;margin:0 0 10px}
.hero p{font-size:14px;line-height:1.5;margin:0 0 18px;color:var(--fog)}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:7px 18px;font-size:14px;font-weight:700;border:1px solid var(--fog);background:transparent;color:var(--fog);cursor:pointer}
.btn.solid{background:var(--white);color:var(--pbs-blue);border-color:var(--white)}
.btn svg{width:11px;height:12px;fill:currentColor}
@container dev (max-width:767px){.hero{min-height:360px;padding-bottom:28px}.hero-show{font-size:24px}.hero h2{font-size:16px}.hero p{font-size:13px}}

/* ===== Rows ===== */
.row{padding:0 var(--si);margin-bottom:var(--sb)}
.row-h{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:700;line-height:1.25;margin:0 0 16px}
.row-h .live-dot{width:16px;height:16px;border-radius:50%;background:var(--red);flex:none}
.row-h small{font-size:13px;font-weight:500;color:var(--pebble)}
@container dev (max-width:767px){.row-h{font-size:16px;margin-bottom:10px}.row-h .live-dot{width:11px;height:11px}}
.skel{display:flex;gap:16px;overflow:hidden}
.skel div{flex:0 0 calc((100% - 96px)/7);aspect-ratio:2/3;border-radius:6px;background:linear-gradient(160deg,#141a3c,#0b1030);opacity:.75}
@container dev (max-width:767px){.skel div{flex-basis:calc((100% - 16px)/2.4)}}
.ctx-note{font-size:11px;color:var(--slate);margin:-6px 0 0;letter-spacing:.02em}

.tiles{display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 64px)/5);gap:16px;overflow-x:auto;overflow-y:visible;padding:8px 4px 10px;margin:-8px -4px 0;scrollbar-width:none}
.tiles::-webkit-scrollbar{display:none}
.tiles-wrap{position:relative}
.arrow{position:absolute;top:50%;translate:0 -50%;z-index:5;width:56px;height:56px;border-radius:50%;border:0;background:rgba(38,56,196,.85);color:#fff;display:grid;place-items:center;cursor:pointer}
.arrow svg{width:11px;height:19px;fill:currentColor}
.arrow.prev{left:-28px}.arrow.next{right:-28px}
@container dev (max-width:767px){.arrow{display:none}}
@container dev (max-width:1439px){.tiles{grid-auto-columns:calc((100% - 36px)/4)}}
@container dev (max-width:767px){.tiles{grid-auto-columns:calc((100% - 8px)/2);gap:8px}}

/* ChannelThumbnail */
.tile{--pad:16px;position:relative;display:block;aspect-ratio:16/9;border-radius:7.5px;overflow:hidden;background:var(--midnight);outline:3px solid transparent;transition:scale var(--dur) ease-in-out,border-radius var(--dur),outline-color var(--dur);cursor:pointer;text-align:left;border:0;padding:0;color:var(--fog);container-type:inline-size;width:100%}
.tile:hover,.tile:focus-visible{scale:1.05;border-radius:3px;outline-color:var(--white);z-index:2}
.tile>img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.6}
.tile-i{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;justify-content:space-between;padding:var(--pad)}
.tile-name{display:flex;align-items:center;gap:8px;min-height:24px}
.tile-name img{max-height:24px;max-width:120px;width:auto}
.bug{display:inline-flex;align-items:center;gap:5px;border:2px solid var(--fog);padding:2px 7px 2px 6px;font-size:11px;font-weight:700;line-height:1.1;text-transform:uppercase;letter-spacing:.02em;white-space:nowrap}
.bug::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--red)}
.bug.radio::before{display:none}
.bug.radio svg{width:12px;height:12px;fill:currentColor}
.t-show{font-size:18px;font-weight:700;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-ep{font-size:15px;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@container (max-width:220px){.tile{--pad:8px}.tile .bug{display:none}.tile .lockup{--lh:14px!important}.t-show{font-size:13px}.t-ep{font-size:12px}.tile-name img{max-height:16px}}

/* radio tile */
.field{position:absolute;inset:0;overflow:hidden}
.field.brand{background:linear-gradient(135deg,var(--c1),var(--c2))}
.field.brand::before{content:"";position:absolute;width:180%;aspect-ratio:1;left:-90%;bottom:-120%;background:repeating-radial-gradient(circle,rgba(255,255,255,.09) 0 2px,transparent 2px 22px);}
.field.scenery img{width:100%;height:100%;object-fit:cover;opacity:.55}
.field.scenery::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,5,37,.85),rgba(0,5,37,.1) 70%)}
.field.art{background:linear-gradient(135deg,var(--c1),var(--c2))}
.field .cover{position:absolute;right:6%;top:50%;translate:0 -50%;height:72%;aspect-ratio:1;border-radius:4px;box-shadow:0 8px 24px rgba(0,0,0,.45);background:conic-gradient(from 210deg at 35% 40%,#e8c26a,#c4553c,#3b1d5a,#1b3b6f,#e8c26a);display:grid;place-items:end start;padding:6px;font-size:8px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.85)}
.lockup{color:#fff;display:inline-flex;flex-direction:column;align-items:flex-start;gap:3px;line-height:1}
.lockup img{height:var(--lh,22px);width:auto;max-width:none}
.lockup .lk-n{font-weight:800;font-size:calc(var(--lh,22px)*.62);letter-spacing:.14em;text-transform:uppercase}
.lockup{max-width:92%}
.lk-t{min-width:0;max-width:100%}
.lockup.lk-row{min-width:0}
.lk-row .lk-t{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tile-name{min-width:0}
.lockup.lk-long .lk-n{letter-spacing:.06em;font-size:calc(var(--lh,22px)*.5)}
.lockup.full{align-items:flex-start}
.lockup.full .lk-n{text-transform:none;letter-spacing:0;font-weight:700;font-size:calc(var(--lh,22px)*.5);line-height:1.15;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.lk-img{display:block;flex:none;max-width:none!important}
.lk-canvas{position:relative;display:block;flex:none}
.lk-canvas .lk-img{position:absolute}
.lk-txt{font-weight:800;letter-spacing:.04em;line-height:1;color:#fff}
.show-boxes .lk-img{outline:1px dashed rgba(255,207,0,.9)}
.show-boxes .lk-canvas{outline:1px solid rgba(72,211,205,.9)}
.lockup .lk-f{font-weight:500;font-size:calc(var(--lh,22px)*.48);opacity:.85;letter-spacing:.02em}
.lockup.lk-row{flex-direction:row;align-items:center;gap:8px}
.eq{display:inline-flex;align-items:flex-end;gap:2px;height:12px}
.eq i{width:3px;background:currentColor;border-radius:1px;height:30%;animation:eq 1s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.4s}.eq i:nth-child(3){animation-delay:-.2s}.eq i:nth-child(4){animation-delay:-.7s}
.eq.still i{animation:none;height:40%}
@keyframes eq{0%,100%{height:25%}50%{height:100%}}
@media (prefers-reduced-motion:reduce){.eq i{animation:none;height:60%}}
.playing-tag{display:inline-flex;align-items:center;gap:6px;color:var(--teal);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}

/* option B: single listen tile + picker */
.picker{position:absolute;z-index:30;width:320px;background:var(--paynes);border:1px solid #2a3157;border-radius:10px;box-shadow:0 18px 50px rgba(0,0,0,.6);padding:8px}
.picker h4{margin:6px 10px 8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--pebble)}
.pk{display:flex;align-items:center;gap:12px;width:100%;padding:10px;border:0;background:transparent;border-radius:8px;text-align:left;cursor:pointer}
.pk:hover,.pk:focus-visible{background:#232a4f}
.pk .sq{width:44px;height:44px;border-radius:6px;flex:none;position:relative;overflow:hidden}
.pk b{display:block;font-size:14px}
.pk span{display:block;font-size:12.5px;color:var(--pebble);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk .t{min-width:0;flex:1}
.pk .pi{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--fog);display:grid;place-items:center;flex:none}
.pk .pi svg{width:9px;height:11px;fill:currentColor;margin-left:2px}

/* option C: radio row cards (square) */
.rcards{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(260px,calc((100% - 48px)/4));gap:16px;overflow-x:auto;scrollbar-width:none}
@container dev (max-width:767px){.rcards{grid-auto-columns:78%;gap:8px}}
.rcard{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center;padding:12px;border-radius:7.5px;background:var(--paynes);border:0;text-align:left;cursor:pointer;outline:3px solid transparent;transition:outline-color var(--dur),background var(--dur);width:100%}
.rcard:hover,.rcard:focus-visible{outline-color:var(--white);background:#1f2547}
.rcard .sq{position:relative;aspect-ratio:1;border-radius:5px;overflow:hidden;display:grid;place-items:center}
.rcard .sq .lockup{position:relative;z-index:1}

/* donate band */
.donate{margin:0 var(--si) var(--sb);border-radius:4px;background:var(--medium-blue);padding:36px 48px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.donate b{font-size:20px}
.donate .btn{background:var(--white);color:var(--pbs-blue);border-color:var(--white)}
.donate .btn svg{width:16px;height:14px}
@container dev (max-width:767px){.donate{padding:20px;flex-direction:column;align-items:flex-start}}
.foot{background:var(--navy);padding:36px var(--si);display:grid;grid-template-columns:repeat(3,1fr);gap:24px;font-size:13px}
.foot b{display:block;color:var(--coral);font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:12px}
.foot span{display:block;margin-bottom:8px;color:var(--fog)}
@container dev (max-width:767px){.foot{grid-template-columns:1fr 1fr}}

/* ===== /livestream ===== */
.lv-player-wrap{border-bottom:1px solid var(--slate);background:var(--midnight)}
.lv-player{position:relative;max-width:1160px;margin:0 auto;aspect-ratio:16/9;overflow:hidden;background:#000}
.lv-player img.frame{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.lv-player .ov{position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.75),rgba(0,0,0,0) 55%);display:flex;flex-direction:column;justify-content:flex-end;padding:28px 32px 18px}
.lv-meta{display:grid;gap:6px;margin-bottom:16px}
.lv-meta .bug{width:max-content;font-size:10px;border-width:1.5px}
.lv-meta img{height:26px;width:auto}
.lv-meta b{font-size:20px}
.lv-meta span{font-size:14px}
.lv-ctl{display:flex;align-items:center;gap:20px;border-top:3px solid rgba(255,255,255,.35);padding-top:12px;font-size:12px}
.lv-ctl .prog{position:relative;height:3px;margin-top:-15px;background:var(--fog);width:40%}
.lv-ctl svg{width:14px;height:16px;fill:var(--fog)}
.lv-paused{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,5,37,.55);z-index:2}
.lv-paused div{display:grid;justify-items:center;gap:12px;text-align:center;max-width:360px;padding:16px}
.lv-paused .big{width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,.95);color:var(--midnight);display:grid;place-items:center;border:0;cursor:pointer}
.lv-paused .big svg{width:22px;height:26px;fill:currentColor;margin-left:4px}
.lv-paused p{margin:0;font-size:14px;line-height:1.45}
@container dev (max-width:767px){.lv-player .ov{padding:12px}.lv-meta{gap:3px;margin-bottom:8px}.lv-meta img{height:16px}.lv-meta b{font-size:14px}.lv-meta span{font-size:12px}.lv-meta .lv-sub{display:none}.lv-ctl{gap:12px;font-size:10px}}

/* audio stage inside player area */
.stagebox{position:relative;max-width:1160px;margin:0 auto;aspect-ratio:16/9;overflow:hidden;display:grid;grid-template-columns:1.1fr 1fr;align-items:center;gap:40px;padding:48px 56px}
.stagebox.banner{aspect-ratio:auto;min-height:200px;grid-template-columns:auto 1fr auto;padding:24px 32px;gap:28px}
.stagebox .field{z-index:0}
.stagebox>*:not(.field):not(.viz){position:relative;z-index:1}

span.illus,.illus{display:inline-block!important;width:auto!important;font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--midnight);background:var(--yellow);border-radius:3px;padding:1px 4px;margin-left:6px;vertical-align:2px}

.b-feature p{margin:0;font-size:15px;line-height:1.55;color:var(--b-sub)}
.b-side{display:grid;gap:20px;align-content:start}
.b-sec-h{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--b-nav);border-bottom:3px solid var(--b-acc);padding-bottom:6px;margin:0 0 4px}
.b-news{display:grid;gap:14px}
.b-news div{display:grid;grid-template-columns:96px 1fr;gap:12px;font-size:14px;font-weight:700;color:var(--b-nav);line-height:1.35}
.b-news div i{aspect-ratio:4/3;border-radius:3px;background:linear-gradient(140deg,#d5dde7,#94a1b2)}
.b-full{padding:0 var(--si) 40px}
.b-foot{background:var(--b-nav);color:#fff;padding:28px var(--si);font-size:13px;display:flex;gap:24px;flex-wrap:wrap}
.b-foot img{height:44px;width:auto}
.b-ctx{font-size:11px;color:var(--b-sub);margin:0 var(--si) 0;padding-top:10px}

/* station player widget, themed by --w-* */
.wdg{--w-bg:#0b1135;--w-card:#141b45;--w-fg:var(--fog);--w-sub:var(--pebble);--w-line:rgba(148,161,178,.22);--w-acc:var(--teal);--w-btn:var(--white);--w-btn-fg:var(--pbs-blue);--w-hover:#1c2456;
  background:var(--w-bg);color:var(--w-fg);border-radius:10px;padding:18px;display:grid;gap:12px;font-family:var(--sans)}
.wdg-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.wdg-h b{font-size:18px;display:flex;align-items:center;gap:10px}
.wdg-h b .live-dot{width:12px;height:12px;border-radius:50%;background:var(--red)}
.wdg-h a{font-size:13px;color:var(--w-sub);text-decoration:underline;text-underline-offset:3px}
.wrow{display:grid;grid-template-columns:72px 1fr auto;gap:14px;align-items:center;padding:10px;border-radius:8px;background:var(--w-card);border:0;text-align:left;cursor:pointer;color:var(--w-fg);outline:2px solid transparent;transition:outline-color var(--dur),background var(--dur);width:100%}
.wrow:hover{background:var(--w-hover)}
.wrow .sq{aspect-ratio:1;border-radius:6px;overflow:hidden;position:relative;display:grid;place-items:center}
.wrow .sq .lockup{position:relative;z-index:1}
.wrow b{display:block;font-size:16px}
.wrow .now{display:block;font-size:14px;margin-top:2px}
.wrow .nx{display:block;font-size:12.5px;color:var(--w-sub);margin-top:2px}
.wrow .t{min-width:0}
.wrow .t *{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrow .pi{width:44px;height:44px;border-radius:50%;background:var(--w-btn);color:var(--w-btn-fg);display:grid;place-items:center}
.wrow .pi svg{width:13px;height:15px;fill:currentColor}
.wrow .pi .pl{margin-left:3px}
.wdg-ft{font-size:12px;color:var(--w-sub)}
.wdg.compact{padding:14px}
.wdg.compact .sel{display:flex;gap:6px;flex-wrap:wrap}
.wdg.compact .sel button{border:1px solid var(--w-line);background:transparent;color:var(--w-fg);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer}
.wdg.compact .sel button[aria-pressed="true"]{background:var(--w-fg);color:var(--w-bg);border-color:var(--w-fg)}
.wdg.compact .big{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.wdg.compact .big b{font-size:17px;display:block}
.wdg.compact .big span{font-size:13px;color:var(--w-sub);display:block}
.th-brand{--w-bg:#121340;--w-card:#1d1f5a;--w-fg:#fff;--w-sub:#c3c6e8;--w-line:rgba(255,255,255,.22);--w-acc:#ff4d6d;--w-btn:#a5002f;--w-btn-fg:#fff;--w-hover:#26297a;
  --bp-bg:#121340;--bp-fg:#fff;--bp-sub:#c3c6e8;--bp-line:rgba(255,255,255,.18);--bp-acc:#ff8aa0;--bp-btn:#a5002f;--bp-btn-fg:#fff;--bp-prog:#ff4d6d}
.th-light{--w-bg:#eef0f5;--w-card:#fff;--w-fg:#000525;--w-sub:#5c6e85;--w-line:#c0cbda;--w-acc:#2638c4;--w-btn:#2638c4;--w-btn-fg:#fff;--w-hover:#f6f8fa;
  --bp-bg:#fff;--bp-fg:#000525;--bp-sub:#5c6e85;--bp-line:#d5dde7;--bp-acc:#2638c4;--bp-btn:#2638c4;--bp-btn-fg:#fff;--bp-prog:#2638c4}
.th-light .bug,.th-light .bp-t .over .bug{border-color:currentColor}
.hdr-pop{position:absolute;right:var(--si);top:calc(100% + 6px);z-index:30;width:380px;max-width:calc(100% - 32px);box-shadow:0 18px 50px rgba(0,0,0,.35)}

/* ===== Logo lab ===== */
.lab{padding:28px var(--si) 60px;display:grid;gap:28px;color:var(--fog)}
.lab-h h1{margin:0 0 6px;font-size:28px}
.lab-h p{margin:0;max-width:760px;font-size:14px;line-height:1.5;color:var(--moon)}
.lab-ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px}
.lab-ctl select{background:#0e1436;color:var(--fog);border:1px solid var(--pt-line);border-radius:8px;padding:7px 10px;font:inherit;font-size:13px;max-width:100%}
.lab-ctl .pt-btn{padding:6px 12px}
.lab-ctl label{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--moon)}
.chipset{display:flex;flex-wrap:wrap;gap:6px}
.chipset button{border:1px solid var(--pt-line);background:transparent;border-radius:999px;padding:5px 11px;font-size:12px;font-weight:700;color:var(--moon);cursor:pointer}
.chipset button[aria-pressed="true"]{background:var(--fog);color:var(--midnight);border-color:var(--fog)}
.chipset button b{font-weight:800;margin-left:4px;opacity:.7}
.lab-sec{display:grid;gap:12px}
.lab-sec>h2{margin:0;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--pebble);display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.lab-sec>h2 small{font-size:12px;letter-spacing:0;text-transform:none;font-weight:500;color:var(--slate)}
.specs{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end}
.spec{display:grid;gap:6px;min-width:0}
.spec>i{font-style:normal;font-size:11px;color:var(--slate);font-variant-numeric:tabular-nums}
.scroller{overflow-x:auto;padding-bottom:6px}
.sq-spec{position:relative;border-radius:6px;overflow:hidden;display:grid;place-items:center;flex:none}
.sq-spec .lockup{position:relative;z-index:1}
.sq-spec.r10{border-radius:10px}
.ltable{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.ltable th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--pebble);font-weight:700;padding:6px 10px;border-bottom:1px solid #2a3157}
.ltable td{padding:8px 10px;border-bottom:1px solid #1a2045;vertical-align:middle}
.ltable .sw{display:grid;place-items:center;width:150px;height:56px;border-radius:6px}
.ltable .sw.dark{background:#0f1e8c}.ltable .sw.light{background:#fff}
.ltable .sw img{max-width:130px;max-height:40px}
.flag{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;border-radius:3px;padding:2px 6px;margin:0 4px 4px 0;background:#1d2550;color:var(--moon)}
.flag.warn{background:rgba(254,112,78,.18);color:var(--coral)}
.flag.ok{background:rgba(72,211,205,.14);color:var(--teal)}
.mini-grid{display:grid;gap:8px}
.mini-grid .ch{margin:0}
.mini-grid .lst .li{left:0;right:0;width:auto}
.bar-spec .bp{position:relative!important;inset:auto}
.bar-spec .bp-bar{box-shadow:none}
.sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(520px,1fr));gap:14px}
@container dev (max-width:767px){.sheet{grid-template-columns:1fr}}
.card{background:var(--paynes);border-radius:10px;padding:14px;display:grid;gap:12px;min-width:0}
.card-h{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.card-h b{font-size:15px}
.card-h span{font-size:12px;color:var(--pebble)}
.card-h button{background:none;border:0;color:var(--teal);font-weight:700;font-size:12px;cursor:pointer;padding:0}
.card-row{display:flex;gap:12px;align-items:center;overflow-x:auto;padding-bottom:4px}

/* ===== Synced with Figma (Nov 19, 2026) =====
   Type uses PBS.org Design System styles (sizes from dotorg-next _mixins.scss):
   H1 Max 30/1.1 · H2 Max 22/1.25 · H4 Max 18/1.25 · H5 Max 16 · H6 Max 14 · Min 13 Bold
   Body Copy 1 16/1.5 · Body Copy 2 14/1.5 · Body Copy 3 13/1.5 · H4 MIN CAPS 11 bold caps (over-title)
   Radii: tiles 14 (6 when small), logo tiles 14 at 140px+ else 6, cards and menus 10, player area and bars 0. */
.capsm{font-size:11px;font-weight:700;line-height:1.5;text-transform:uppercase;letter-spacing:0}
/* Live radio badge (Radio / Live radio badge): outlined like the Live bug, headphones instead of the red dot */
.bug.radio{gap:5px;padding:2px 8px 2px 6px;border-width:2px;font-size:11px;letter-spacing:0}
.bug.radio svg{width:12px;height:12px}
.bug.radio.min{border-width:1.5px;padding:1px 6px 1px 5px}
.bug.radio.min svg{width:10px;height:10px}
/* DS Badge, coral “Now Playing” (Badge.module.scss .coral) */
.np-badge{display:inline-flex;align-items:center;width:max-content;padding:3px 8px;border-radius:5px;background:var(--coral);color:var(--midnight);font-size:11px;font-weight:700;line-height:1.5;text-transform:uppercase;white-space:nowrap}
/* DS Icon Button (icon-button mixin): 2px outline circle */
.ib{width:36px;height:36px;flex:none;display:block;color:var(--ib,#fff)}
.ib.min{width:34px;height:34px}
.ib circle{fill:none;stroke:currentColor;stroke-width:2}
.ib path,.ib rect{fill:currentColor}
/* Brand Assets icons (Pause, Play, Volume, Caret-up, Close) */
.ba{display:block;width:100%;height:100%;fill:currentColor}

/* tiles (ChannelThumbnail + Radio / Tile) */
.tile{border-radius:14px}
.tile:hover,.tile:focus-visible{border-radius:14px}
@container (max-width:220px){.tile,.tile:hover,.tile:focus-visible{border-radius:6px}}
.tile-name{gap:8px}
.t-txt{display:grid;gap:4px;min-width:0}
.t-txt .np-badge{margin-bottom:4px}
.t-show{font-size:18px;font-weight:700;line-height:1.25}
.t-ep{font-size:16px;line-height:1.5}
@container (max-width:220px){.t-show{font-size:13px}.t-ep{font-size:13px}.t-txt{gap:2px}.t-txt .np-badge{font-size:10px;padding:1px 6px;margin-bottom:2px}}
/* logo lockup text (logo tile artwork uses DS styles by size) */
.lockup .lk-n{font-weight:700;letter-spacing:0;font-size:max(11px,calc(var(--lh,22px)*.55));line-height:1.1}
.lockup.lk-long .lk-n{letter-spacing:0;font-size:max(11px,calc(var(--lh,22px)*.45))}
.lockup .lk-f{font-weight:400;font-size:max(10px,calc(var(--lh,22px)*.4));opacity:1;color:var(--moon);letter-spacing:0}
.lockup.lk-row .lk-n{font-size:11px;line-height:1.5}
.tile-name .lockup.lk-row{gap:8px}

/* stream picker (Radio / Stream picker) */
.picker{background:var(--charcoal);border:1px solid var(--blue-gray);border-radius:10px;padding:8px;display:grid;gap:2px}
.picker h4{margin:0;padding:6px 0 8px 10px;font-size:11px;font-weight:700;line-height:1.5;letter-spacing:0;color:var(--pebble)}
.pk{padding:10px;gap:12px;border-radius:8px}
.pk:hover,.pk:focus-visible{background:#2a2d40}
.pk .t{display:grid;gap:2px}
.pk b{font-size:14px;line-height:1.5}
.pk span{font-size:13px;line-height:1.5}
.pk .sq{border-radius:6px}

/* radio card (Radio / Card): home option C and /livestream section B */
.rcard{grid-template-columns:96px minmax(0,1fr) auto;gap:14px;padding:12px;border-radius:10px;background:var(--charcoal)}
.rcard:hover,.rcard:focus-visible{background:#262a3e}
.rcard .sq{border-radius:6px}
.rcard .t{display:grid;gap:4px;min-width:0}
.rcard .t b{font-size:16px;line-height:1.5}
.rcard .t span{font-size:13px;line-height:1.5;color:var(--pebble)}
.rcard .t span.st{color:var(--white)}
.rlist{grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}

/* schedule grid (MultiLivestream Listing) */
.li{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:20px 24px}
.li b{margin:0;font-size:13px;font-weight:700;line-height:1.5}
.li span.d{font-size:16px;line-height:1.5;color:var(--pebble)}
.li .np{margin:0 0 4px;gap:6px;padding:2px 8px;border:2px solid var(--fog);font-size:14px;font-weight:700;line-height:1.5}
.li .np::before{width:8px;height:8px}
.li>*{flex:none}
.li .ib{margin-top:4px}
@container (max-width:110px){.li{padding:12px}.li .np,.li .ib{display:none}}
@container dev (max-width:767px){.li{padding:12px 14px;gap:4px}.li span.d{font-size:13px}.li .np{font-size:11px;padding:1px 6px}.li .ib{width:28px;height:28px}}
.ch.radio .ch-btn button{background:var(--blue-gray)}
.ch.radio .ch-btn button:hover{background:var(--slate)}
.grid-div{color:var(--fog);font-size:11px;font-weight:700;letter-spacing:0;line-height:1.5;margin:22px 0 10px}

/* player area (Radio / Player area) */
.stagebox{grid-template-columns:minmax(180px,340px) minmax(0,560px);gap:64px;padding:48px 56px;justify-content:start}
.stagebox.banner{grid-template-columns:auto minmax(0,1fr) auto;gap:28px;padding:24px 32px}
.st-art{border-radius:14px;box-shadow:0 0 35px rgba(0,0,0,.5)}
.st-info{gap:10px}
.st-info .over{gap:10px;font-size:11px;font-weight:700;letter-spacing:0;line-height:1.5}
.st-info h2{font-size:30px;line-height:1.1;font-weight:700}
.st-info .sub{font-size:16px;line-height:1.5;color:var(--rain)}
.st-info .next{font-size:14px;line-height:1.5;color:var(--moon)}
.st-prog{height:3px;border-radius:0;background:rgba(148,161,178,.4);max-width:420px;margin-top:4px}
.st-prog i{background:var(--white)}
.st-ctl{gap:24px;margin-top:8px}
.pp{width:40px;height:40px;padding:0;border:0;background:none;color:var(--white);cursor:pointer;flex:none;display:grid;place-items:center}
.pp:hover{color:var(--pebble)}
/* DS Text Button, white ghost, Max */
.tbtn{display:inline-flex;align-items:center;padding:8px 22px;border:2px solid var(--white);border-radius:9999px;background:transparent;color:var(--white);font-size:16px;font-weight:700;line-height:1;cursor:pointer;white-space:nowrap;transition:color var(--dur),border-color var(--dur)}
.tbtn:hover{color:var(--pebble);border-color:var(--pebble)}
.banner .st-info h2{font-size:22px;line-height:1.25}
.banner .st-art{border-radius:6px}
@container dev (max-width:1023px){.stagebox{gap:32px;padding:28px}.st-info h2{font-size:26px}}
@container dev (max-width:767px){.stagebox{grid-template-columns:96px minmax(0,1fr);gap:16px;padding:20px 16px}.stagebox .st-art{border-radius:6px}.st-info h2{font-size:20px;line-height:1.25}.st-info .sub{font-size:14px}.st-info .next{font-size:13px}.st-ctl{grid-column:auto;gap:16px}.pp{width:32px;height:32px}.tbtn{font-size:13px;padding:6px 14px;border-width:1px}}

/* drawer + expanded player */
.np-sec h5{font-size:11px;font-weight:700;line-height:1.5;letter-spacing:0;color:var(--pebble)}
.sch-list div.cur span{color:var(--white)}
.bp .sch-list div.cur span{color:var(--bp-fg)}
.other button{grid-template-columns:44px minmax(0,1fr) auto;border-radius:8px}
.other .sq{border-radius:6px}
.other b{font-size:14px;line-height:1.5}
.other span{font-size:13px;line-height:1.5}
.np-head .sq{border-radius:6px}
.np-head b{font-size:22px;line-height:1.25}
.dr-ctl{display:flex;gap:16px;align-items:center}
.dr-ctl span{font-size:13px;line-height:1.5;color:var(--pebble)}

/* ===== Bottom player (Radio / Bottom player) ===== */
.bp{--bp-bg:#0a145a;--bp-fg:#fff;--bp-sub:var(--pebble);--bp-line:rgba(148,161,178,.35);--bp-prog:#fff;--bp-hover:var(--pebble)}
.bp-bar{display:flex;align-items:center;gap:20px;height:76px;padding:0 max(24px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(24px,env(safe-area-inset-left,0px));background:var(--bp-bg);border-top:1px solid var(--bp-line);box-shadow:0 -10px 30px rgba(0,0,0,.35);grid-template-columns:none}
.bp-prog{position:absolute;left:0;right:0;top:-1px;height:3px;background:rgba(148,161,178,.4)}
.bp-prog i{display:block;height:100%;background:var(--bp-prog);opacity:1}
.bp-ic{width:24px;height:24px;padding:0;border:0;background:none;color:var(--bp-fg);display:grid;place-items:center;cursor:pointer;flex:none}
.bp-ic:hover{color:var(--bp-hover)}
.bp-ic.bp-pp{width:32px;height:32px}
.bp-ic[aria-expanded="true"] svg{rotate:180deg}
.bp-volw{display:flex;align-items:center;gap:10px;flex:none}
.bp-volw input{width:0;opacity:0;margin:0;accent-color:var(--bp-fg);transition:width .2s,opacity .2s}
.bp-volw:hover input,.bp-volw:focus-within input{width:84px;opacity:1}
.bp-l{flex:1;display:flex;align-items:center;gap:14px;min-width:0;cursor:pointer}
.bp-art{width:52px;height:52px;border-radius:6px}
.bp-t{display:grid;gap:2px;min-width:0}
.bp-t .over{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:0;line-height:1.5;color:var(--bp-sub);white-space:nowrap;overflow:hidden}
.bp-t .over .bug{color:var(--bp-fg);border-color:var(--bp-fg)}
.bp-t b{font-size:16px;line-height:1.5;color:var(--bp-fg)}
.bp-t span.l2{font-size:13px;line-height:1.5;color:var(--bp-sub)}
.bp-r{display:flex;align-items:center;gap:20px;flex:none;margin-left:auto}
/* B: play/pause centered */
.bp-bar.v-B{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr)}
.bp-bar.v-B .bp-r{justify-self:end}
/* C: play/pause over the logo tile */
.bp-art .art-pp{position:absolute;inset:0;z-index:2;display:grid;place-items:center;background:rgba(0,5,37,.4);border:0;color:#fff;cursor:pointer;padding:0}
.bp-art .art-pp svg{width:22px;height:22px;fill:currentColor}
/* themes */
.th-brand .bp,.bp.th-brand{--bp-bg:#121340;--bp-fg:#fff;--bp-sub:#c3c6e8;--bp-line:rgba(255,255,255,.18);--bp-prog:#fff;--bp-hover:#c3c6e8}
.bp.th-light{--bp-bg:#fff;--bp-fg:#000525;--bp-sub:#5c6e85;--bp-line:#d5dde7;--bp-prog:#000525;--bp-hover:#5c6e85}
/* expanded panel */
.bp-panel-in{gap:40px}
.bp .other button{background:transparent;border-top:1px solid var(--bp-line);border-radius:0;padding:10px 0}
.bp .other .ib{--ib:var(--bp-fg)}
/* D: Floating Video Player (402 wide, bottom right) */
.bp.float{left:auto;right:20px;bottom:20px;width:402px}
.fl{background:var(--paynes);box-shadow:0 18px 50px rgba(0,0,0,.55);overflow:hidden}
.fl-media{position:relative;height:226px;display:grid;place-items:center;overflow:hidden}
.fl-media{place-items:center start;padding-left:24px}
.fl-media .lockup{position:relative;z-index:1}
.fl-media::after{content:"";position:absolute;inset:0;background:rgba(0,5,37,.4);z-index:0}
.fl-media>.bp-ic,.fl-media>.fl-live,.fl-media>.bp-prog{z-index:2}
.fl-media .fl-pp{position:absolute;left:50%;top:50%;translate:-50% -50%;width:40px;height:40px}
.fl-media .fl-x{position:absolute;right:12px;top:12px;width:20px;height:20px}
.fl-media .fl-x2{position:absolute;left:12px;top:12px;width:20px;height:20px}
.fl-media .fl-vol{position:absolute;left:12px;bottom:14px;width:20px;height:20px}
.fl-live{position:absolute;left:42px;bottom:14px;font-size:13px;font-weight:700;color:#fff;line-height:20px}
.fl-media .bp-prog{top:auto;bottom:0}
.fl-info{padding:12px 14px 14px;display:grid;gap:2px}
.fl-info .over{font-size:11px;font-weight:700;line-height:1.5;text-transform:uppercase;color:#fff}
.fl-info b{font-size:14px;line-height:1.5;color:#fff}
.fl-info span.l2{font-size:13px;line-height:1.5;color:var(--pebble)}
.bp.float .bp-panel{border:0;margin-bottom:8px;border-radius:0}
.bp.float.expanded .bp-panel{border:1px solid var(--bp-line)}
.bp.float .bp-panel-in{grid-template-columns:1fr;gap:18px;padding:18px}
/* mobile bar: [play/pause] art + text … [close] */
@container dev (max-width:767px){
  .bp-bar{height:64px;gap:12px;padding-left:12px;padding-right:12px}
  .bp-bar.v-B{display:flex}
  .bp-volw,.bp-r .bp-exp{display:none}
  .bp-ic.bp-pp{width:24px;height:24px}
  .bp-art{width:44px;height:44px}
  .bp-l{gap:10px}
  .bp-t .over .bug{display:none}
  .bp-t b{font-size:14px}.bp-t span.l2{font-size:12px}
  .bp.float{left:8px;right:8px;bottom:8px;width:auto}
  .fl-media{height:180px}
}

/* ===== Station site: Bento station chrome ===== */
.b-head{height:70px;padding:0 var(--si);gap:24px;background:#fff;border-bottom:1px solid #e3e5ea}
.b-head img{height:48px}
.b-nav{margin-left:auto;gap:52px;font-size:16px;font-weight:400;color:#1d1d1f;align-items:center;flex-wrap:nowrap}
.b-nav .b-li{position:relative;white-space:nowrap;background:none;border:0;padding:0;font:inherit;color:inherit;cursor:default}
.b-nav button.b-li{cursor:pointer}
.b-nav button.b-li[aria-expanded="true"]{text-decoration:underline;text-underline-offset:6px}
.b-nav .sup{color:#a5002f}
.b-search{width:20px;height:20px;color:#5b5e66;display:grid}
.b-search svg{width:20px;height:20px;fill:currentColor}
.hdr-pop{position:absolute;left:50%;top:calc(100% + 18px);translate:-50% 0;right:auto;z-index:30;width:380px;text-align:left;box-shadow:0 18px 50px rgba(0,0,0,.18);border-radius:10px}
.b-nav .hdr-pop{max-width:none;white-space:normal;font-size:14px}
.hdr-pop .wdg{white-space:normal}
.b-listen-m{display:none;border:0;background:none;font:inherit;font-size:15px;color:#1d1d1f;cursor:pointer;padding:6px}
@container dev (max-width:1023px){.b-nav{display:none}.b-burger{display:block}.b-head img{height:40px}.b-search{margin-left:auto}.b-listen-m{display:block}.b-head .hdr-pop{left:auto;right:16px;translate:none;top:calc(100% + 8px);width:min(380px,calc(100% - 32px))}}
.b-head .b-r{display:none}

/* station widget (Radio / Station widget): themes from the station’s Bento colors */
.wdg{--w-bg:#121340;--w-fg:#fff;--w-sub:#c3c6e8;--w-line:rgba(255,255,255,.18);
  background:var(--w-bg);color:var(--w-fg);border-radius:10px;padding:20px 20px 16px;display:block;gap:0;border:1px solid transparent}
.wdg.th-dark{--w-bg:#1e2030;--w-fg:#fff;--w-sub:var(--pebble);--w-line:rgba(148,161,178,.25)}
.wdg.th-light{--w-bg:#fff;--w-fg:#000525;--w-sub:#5c6e85;--w-line:#d5dde7;border-color:#d5dde7}
.wdg-h{display:flex;align-items:baseline;justify-content:space-between;padding-bottom:12px}
.wdg-h b{font-size:18px;line-height:1.25;font-weight:700}
.wdg-h a{font-size:13px;line-height:1.5;color:var(--w-fg);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.wrow{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:16px;align-items:center;padding:14px 0;border:0;border-top:1px solid var(--w-line);border-radius:0;background:transparent;color:var(--w-fg);outline:0;width:100%;text-align:left;cursor:pointer}
.wrow:hover{background:transparent}
.wrow:hover .ib{color:var(--w-sub)}
.wrow:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.wrow .sq{border-radius:6px}
.wrow .t{display:grid;gap:2px;min-width:0}
.wrow .t *{white-space:normal;overflow:visible}
.wrow b{font-size:16px;line-height:1.5}
.wrow .now{font-size:14px;line-height:1.5;margin:0}
.wrow .nx{font-size:13px;line-height:1.5;color:var(--w-sub);margin:0}
.wrow .ib{--ib:var(--w-fg)}
.wdg-ft{padding-top:12px;border-top:1px solid var(--w-line);font-size:13px;line-height:1.5;color:var(--w-sub)}
.sq-spec.r14{border-radius:14px}
.bp-t .over span{font-size:11px;color:inherit}
.ch{min-height:136px}
@container dev (max-width:767px){.ch{min-height:104px}}
.rcards{grid-auto-columns:minmax(330px,calc((100% - 48px)/4))}
@container dev (max-width:767px){.rcards{grid-auto-columns:88%}}
.np-head .tx span{display:block;font-size:13px;line-height:1.5;color:var(--pebble);margin-top:2px}
.bp .np-head .tx span{color:var(--bp-sub)}

/* ===== Nov 19, round 2 ===== */
/* art aligns to the top of the stream text */
.bp-l{align-items:flex-start}
.bp-bar{align-items:center}
.np-head{align-items:start}
.other button{align-items:start}
.other button .ib{align-self:center}
/* expanded player on Neutrals / Blue-Gray (same surface as PBS.org header menus) */
.bp.pbg .bp-panel{--bp-sub:var(--moon);--bp-line:rgba(255,255,255,.2);background:var(--blue-gray);border-top:0}
.bp.pbg .bp-panel .np-head .tx span,.bp.pbg .bp-panel .other span,.bp.pbg .bp-panel h5,.bp.pbg .bp-panel .sch-list div span{color:var(--moon)}

/* PBS.org header: live menus (menu-background + menu-triangle mixins) */
.nav-l{align-self:stretch}
.nm{position:relative;display:inline-flex;align-items:center;align-self:stretch}
.nm::before{content:"";position:absolute;left:50%;bottom:0;translate:-50% 0;border-width:0 17px 12px;border-style:solid;border-color:transparent transparent var(--blue-gray);opacity:0;transition:opacity .15s ease-in;pointer-events:none}
.nmenu{position:absolute;top:100%;left:50%;translate:-50% 0;width:320px;padding:8px;border-radius:6px;background:linear-gradient(to bottom,rgba(61,74,107,1) 5px,rgba(61,74,107,.92) 60px);backdrop-filter:blur(12px);box-shadow:0 18px 40px rgba(0,0,0,.35);display:grid;gap:2px;opacity:0;pointer-events:none;transition:opacity .15s ease-in;z-index:30;text-align:left}
.nm:hover::before,.nm:focus-within::before,.nm.open::before{opacity:1}
.nm:hover .nmenu,.nm:focus-within .nmenu,.nm.open .nmenu{opacity:1;pointer-events:auto}
.nav .lnk svg.hp{width:14px;height:14px;fill:currentColor}
.nm-row{display:grid;grid-template-columns:20px minmax(0,1fr);gap:12px;align-items:start;width:100%;padding:12px;border:0;border-radius:4px;background:none;color:var(--white);text-align:left;cursor:pointer;font:inherit}
.nm-row:hover,.nm-row:focus-visible{background:rgba(0,5,37,.28)}
.nm-row .ic2{display:grid;place-items:center;height:24px}
.nm-row .ic2 .dot{width:11px;height:11px;border-radius:50%;background:var(--red)}
.nm-row .ic2 svg{width:16px;height:16px;fill:currentColor}
.nm-row b{display:block;font-size:16px;line-height:1.5}
.nm-row span.s{display:block;font-size:13px;line-height:1.5;color:var(--moon)}
.nm-st{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:start;width:100%;padding:10px;border:0;border-radius:4px;background:none;color:var(--white);text-align:left;cursor:pointer;font:inherit}
.nm-st:hover,.nm-st:focus-visible{background:rgba(0,5,37,.28)}
.nm-st .sq{position:relative;width:44px;height:44px;border-radius:6px;overflow:hidden}
.nm-st b{display:block;font-size:14px;line-height:1.5}
.nm-st span.s{display:block;font-size:13px;line-height:1.5;color:var(--moon);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm-st .ib{align-self:center}
.nm-h{padding:8px 12px 4px;font-size:11px;font-weight:700;line-height:1.5;text-transform:uppercase;color:var(--moon)}
.nm-ft{display:block;width:100%;margin-top:4px;padding:10px 12px;border:0;border-top:1px solid rgba(255,255,255,.2);background:none;color:var(--white);font:inherit;font-size:13px;font-weight:700;text-align:left;cursor:pointer}
.nm-ft:hover{text-decoration:underline}
@container dev (max-width:767px){.nmenu{left:-84px;translate:none;width:358px}}
/* bottom player: 16px breathing room under the progress line (was a fixed 76px bar, content nearly touched it) */
.bp-bar{height:auto;min-height:76px;padding-top:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
@container dev (max-width:767px){.bp-bar{height:auto;min-height:64px;padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}}

/* ===== Nov 19, round 3 ===== */
/* lockups are scaled to fit their tile by fitLockups(); keep the scale centered */
.lockup.fit{position:absolute!important;left:50%;top:50%;transform-origin:center;width:max-content;transform:translate(-50%,-50%)}
.lockup.fit:not(.full){max-width:none}
/* scrolling text for truncated lines */
.mq{display:block;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bp-t .mq-in,.fl-info .mq-in{font:inherit;color:inherit;white-space:nowrap;overflow:visible}
.bp-t .over .mq{flex:1 1 auto}
.mq.mq-on{text-overflow:clip;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 18px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 18px),transparent)}
.mq.mq-on .mq-in{display:inline-block;animation-name:mq;animation-timing-function:linear;animation-fill-mode:both}
.mq.mq-on.mq-done{-webkit-mask-image:none;mask-image:none;text-overflow:ellipsis}
.mq.mq-on.mq-done .mq-in{display:inline}
@keyframes mq{0%,14%{transform:translateX(0)}76%,90%{transform:translateX(var(--d))}100%{transform:translateX(0)}}
.bp-t:hover .mq.loop .mq-in,.fl-info:hover .mq.loop .mq-in{animation-play-state:paused}
@media (prefers-reduced-motion:reduce){.mq.mq-on .mq-in{animation:none!important;display:inline}.mq.mq-on{text-overflow:ellipsis;mask-image:none;-webkit-mask-image:none}}

/* ===== Station options B (embed) and D (bar under the header) ===== */
.b-nav .b-li.cur{font-weight:700}
.b-page-h{padding:28px var(--si) 20px;max-width:860px}
.b-page-h h1{margin:4px 0 8px;font-size:30px;line-height:1.1;color:var(--b-nav)}
.b-page-h p{margin:0;font-size:16px;line-height:1.5;color:var(--b-sub)}
.embed{margin:0 var(--si) 48px;background:var(--midnight);color:var(--fog);font-family:var(--sans);border-radius:0;overflow:hidden;container:emb / inline-size}
.embed .sched{padding:32px 24px 8px}
.embed .rsec{padding:8px 24px 24px}
.embed-ft{margin:0;padding:10px 24px 16px;font-size:13px;line-height:1.5;color:var(--pebble)}
.embed-ft a{color:var(--fog);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.ph-frame{position:absolute;inset:0;background:linear-gradient(135deg,#1b2350,#3d4a6b);display:grid;place-items:center}
.ph-frame span{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.35)}
@container dev (max-width:767px){.embed{margin:0 0 32px}.embed .sched{padding:24px 16px 8px}.b-page-h h1{font-size:22px}}

.b-np{--w-bg:#121340;--w-fg:#fff;--w-sub:#c3c6e8;--w-line:rgba(255,255,255,.18);background:var(--w-bg);color:var(--w-fg);font-family:var(--sans);border-bottom:1px solid var(--w-line);position:relative;z-index:15}
.b-np.th-dark{--w-bg:#1e2030;--w-fg:#fff;--w-sub:var(--pebble);--w-line:rgba(148,161,178,.25)}
.b-np.th-light{--w-bg:#f6f8fa;--w-fg:#000525;--w-sub:#5c6e85;--w-line:#d5dde7}
.b-np-in{display:flex;align-items:center;gap:14px;min-height:64px;padding:8px var(--si)}
.b-np-pp{padding:0;border:0;background:none;color:var(--w-fg);cursor:pointer;display:grid;flex:none}
.b-np-pp .ib{--ib:var(--w-fg)}
.b-np-pp:hover .ib{color:var(--w-sub)}
.b-np-art{position:relative;width:44px;height:44px;border-radius:6px;overflow:hidden;flex:none;display:grid;place-items:center}
.b-np-art .lockup{z-index:1}
.b-np-t{display:grid;gap:0;min-width:0;flex:1}
.b-np-k{font-size:11px;font-weight:700;line-height:1.5;text-transform:uppercase;color:var(--w-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b-np-now{font-size:16px;font-weight:700;line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b-np-r{display:flex;align-items:center;gap:24px;flex:none}
.b-np-swrap{position:relative}
.b-np-sw{border:1px solid var(--w-fg);border-radius:9999px;background:transparent;color:var(--w-fg);font:inherit;font-size:13px;font-weight:700;padding:6px 14px;cursor:pointer;white-space:nowrap}
.b-np-sw[aria-expanded="true"]{background:var(--w-fg);color:var(--w-bg)}
.b-np-a{font-size:13px;line-height:1.5;color:var(--w-fg);text-decoration:underline;text-underline-offset:3px;cursor:pointer;white-space:nowrap}
.b-np-menu{position:absolute;right:0;top:calc(100% + 10px);width:380px;z-index:30;box-shadow:0 18px 50px rgba(0,0,0,.3);border-radius:10px}
@container dev (max-width:1023px){.b-np-a{display:none}}
@container dev (max-width:767px){.b-np-in{gap:10px;padding:8px 12px}.b-np-art{display:none}.b-np-now{font-size:14px}.b-np-sw{padding:5px 10px;font-size:12px}.b-np-menu{width:min(380px,calc(100cqw - 24px));right:-4px}}
/* PBS light theme: controls in PBS Blue (hover Medium Blue, as the blue ghost button does) */
.wdg.th-light .wrow .ib,.b-np.th-light .b-np-pp .ib,.bp.th-light .other .ib{--ib:var(--pbs-blue)}
.wdg.th-light .wrow:hover .ib,.b-np.th-light .b-np-pp:hover .ib,.bp.th-light .other button:hover .ib{color:var(--medium-blue)}
.b-np.th-light .b-np-sw{border-color:var(--pbs-blue);color:var(--pbs-blue)}
.b-np.th-light .b-np-sw:hover{border-color:var(--medium-blue);color:var(--medium-blue)}
.b-np.th-light .b-np-sw[aria-expanded="true"]{background:var(--pbs-blue);border-color:var(--pbs-blue);color:#fff}
.bp.th-light{--bp-prog:var(--pbs-blue)}
.bp.th-light .bp-ic{color:var(--pbs-blue)}
.bp.th-light .bp-ic:hover{color:var(--medium-blue)}
.bp.th-light .fl-media .bp-ic{color:#fff}

/* ===== R2 (Nov 19 review) ===== */
/* badge without RADIO: B keeps the red live dot, then headphones */
.bug.radio.dot::before{display:inline-block;width:7px;height:7px}
.bug.radio.dot.min::before{width:6px;height:6px}
.bug.radio.dot svg{margin-left:1px}
/* small tiles (2-up on phones): when playing, the badge replaces the subtitle so nothing is cut off */
@container (max-width:220px){.t-txt .np-badge ~ .t-ep{display:none}.tile.radio .tile-name{min-height:16px}}
/* expanded player header: room for the caret (was 8px from the edge) */
.bp-ph{padding:16px 16px 0 16px}
@container dev (max-width:767px){.bp-ph{padding:20px 20px 4px 20px}.bp-panel-in{padding:16px 20px 20px}}
/* current program row readable in every theme */
.bp .sch-list div.cur{color:var(--bp-fg)}
/* PBS light: expanded player and stream-list popups on Neutrals / Fog */
.bp.th-light .bp-panel{background:var(--fog);--bp-line:var(--rain)}
.hdr-pop .wdg.th-light,.b-np-menu .wdg.th-light{background:var(--fog);border-color:var(--rain);--w-line:var(--rain)}
/* notes: decided and retired options */
.dec-tag{font-size:9.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--midnight);background:var(--fog);border-radius:3px;padding:1px 5px;white-space:nowrap}
.opt.decided{cursor:default}
.n-ret{margin:4px 0 0;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--pt-sub)}
.opt.retired{opacity:.6;border-style:dashed}
.n-arch{font-size:11.5px;line-height:1.5;color:var(--pt-sub);margin:0}
.n-arch a{color:var(--pt-text)}

/* ===== R3 (R2 UI fixes) ===== */
/* phones: the prototype toolbar scrolls instead of widening the page (was pushing the X and Sign In off screen) */
html,body{max-width:100%;overflow-x:hidden}
.proto,.workspace,.stage{max-width:100vw;min-width:0}
.pt .seg{max-width:100%;overflow-x:auto;scrollbar-width:none;flex-wrap:nowrap}
.pt .seg::-webkit-scrollbar{display:none}
.bp-bar{padding-right:max(16px,env(safe-area-inset-right,0px))}
.bp-ic{flex-shrink:0}
.proto{grid-template-columns:minmax(0,1fr)}
.pt{min-width:0}
@media (max-width:600px){.pt{gap:8px}.pt-spacer{display:none}.pt .seg{flex:1 1 auto;min-width:0}#notesBtn{margin-left:auto}}
/* schedule on phones, as pbs.org/livestream (MultiLivestream Listing.module.scss below 768px):
   title only (up to 3 lines) plus the live bug; no duration or play button; channel column clamp(90px, 30vw + 1rem, 200px) */
@container dev (max-width:767px){
  .grid{--ppm:5px;--chw:clamp(90px,calc(30cqw + 16px),200px)}
  .ch{min-height:100px}
  .li{padding:12px 16px 12px 20px;gap:0;justify-content:flex-start}
  .li b{white-space:normal;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;line-height:1.35}
  .li span.d,.li .ib{display:none}
  .li .np{font-size:10px;padding:3px 6px;margin-bottom:8px;border-width:2px}
  .ch-btn button{min-height:100px}
}
@container (max-width:139px){.li .np{display:none}}

/* notes: decided items as plain notes in a collapsible section */
.n-decs{border-top:1px solid var(--pt-line);padding-top:6px}
.n-decs>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;padding:8px 0;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--pt-sub)}
.n-decs>summary::-webkit-details-marker{display:none}
.n-decs>summary::before{content:"";width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;rotate:-45deg;transition:rotate .15s;margin-right:2px}
.n-decs[open]>summary::before{rotate:45deg}
.n-decs>summary span{letter-spacing:0;font-weight:700}
.n-decs-i{margin:0 0 10px;font-size:12px;line-height:1.5;color:var(--pt-sub)}
.dnote{padding:12px 0;border-top:1px solid var(--pt-line);display:grid;gap:6px}
.dnote h3{margin:0;font-size:13px;font-weight:700;color:var(--pt-text)}
.dn-what{margin:0;font-size:12.5px;line-height:1.5;color:var(--pt-text)}
.dn-what b{font-weight:700}
.dn-why{margin:0;font-size:12px;line-height:1.5;color:var(--pt-sub)}
.dn-when{margin:0;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--slate)}
/* ===== Notes drawer ===== */
.notes{width:400px;border-left:1px solid var(--pt-line);background:var(--pt-bg);overflow-y:auto;min-height:0}
.notes[hidden]{display:none}
.notes-in{padding:18px 18px 40px;display:grid;gap:14px}
.n-intro{font-size:13px;line-height:1.5;color:var(--pt-sub);margin:0}
.dec{background:var(--pt-card);border:1px solid var(--pt-line);border-radius:12px;padding:14px;display:grid;gap:10px}
.dec h3{margin:0;font-size:14px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.dec h3 small{font-size:11px;color:var(--pt-sub);font-weight:500}
.opts{display:grid;gap:6px}
.opt{display:grid;grid-template-columns:22px 1fr;gap:8px;text-align:left;border:1px solid var(--pt-line);background:transparent;border-radius:8px;padding:9px 10px;cursor:pointer}
.opt:hover{border-color:#34406f}
.opt[aria-pressed="true"]{border-color:var(--teal);background:rgba(72,211,205,.07)}
.opt .k{width:22px;height:22px;border-radius:6px;background:#18204a;display:grid;place-items:center;font-size:11px;font-weight:800}
.opt[aria-pressed="true"] .k{background:var(--teal);color:var(--midnight)}
.opt b{font-size:13px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.opt span{font-size:12px;line-height:1.45;color:var(--pt-sub);display:block;margin-top:2px}
.rec{font-size:9.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--midnight);background:var(--yellow);border-radius:3px;padding:1px 5px}
.why{font-size:12.5px;line-height:1.5;color:var(--pt-text);margin:0;border-left:2px solid var(--yellow);padding-left:10px}
.scen{display:grid;gap:8px}
.scen label{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px}
.scen .seg button{padding:4px 8px;font-size:11.5px}
.scen label{flex-wrap:wrap}
.scen-h{margin:-2px 0 4px;font-size:11.5px;line-height:1.45;color:var(--pt-sub)}
.n-h{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--pt-sub);margin:8px 0 0}
.n-foot{font-size:11.5px;line-height:1.5;color:var(--pt-sub);margin:0}
@media (max-width:900px){
  .workspace{grid-template-columns:1fr}
  .notes{position:fixed;left:0;right:0;bottom:0;width:auto;max-height:70%;z-index:80;border-left:0;border-top:1px solid var(--pt-line);border-radius:16px 16px 0 0;box-shadow:0 -20px 50px rgba(0,0,0,.6)}
  .stage.mobile{padding:0}.stage.mobile .device{width:100%;height:100%;border-radius:0;border:0}

/* logo lab */
const LUM_MIN = .75;
function pickLogo(stn) {
  const L = stn.logos || {};
  switch (S.opt.logoVariant) {
    case 'wcob': return L.wcob || null;
    case 'white': return L.white || null;
    default: return (L.white && L.white.lum >= LUM_MIN) ? L.white : (L.wcob || L.white || null);
  }
}
const pickLabel = (stn) => { const L = stn.logos || {}; if (S.opt.logoVariant === 'wcob') return L.wcob ? 'White co-branded' : 'Call letters (no logo)'; if (S.opt.logoVariant === 'white') return L.white ? 'White' : 'Call letters (no white logo)'; return L.white && L.white.lum >= LUM_MIN ? 'White' : L.wcob ? (L.white ? 'White co-branded (white logo too dark)' : 'White co-branded (no white logo)') : 'Call letters'; };
function labStream(stn, s, i) {
  return { id:'lab-' + s.id, station:stn.call, call:s.call, callText:stn.call, name:s.name, freq:s.freq || 'Online stream', short:null, labIndex:i, labLogo:s.custom || pickLogo(stn), custom:!!s.custom, labNow:s.now, labSub:s.sub, sched:null };
}
function flagsOf(stn) {
  const L = stn.logos || {}, f = [];
  const w = L.white, ar = w ? (w.bb[2] - w.bb[0]) / (w.bb[3] - w.bb[1]) : null;
  const pad = w ? 1 - ((w.bb[2] - w.bb[0]) * (w.bb[3] - w.bb[1])) / (w.W * w.H) : 0;
  if (!w && !stn.sample) f.push(['nowhite', 'No white logo', 1]);
  if (w && w.lum < LUM_MIN) f.push(['dark', 'White logo isn’t light', 1]);
  if (ar && ar > 4.5) f.push(['wide', `Wide ${ar.toFixed(1)}:1`, 0]);
  if (ar && ar < 2) f.push(['compact', `Compact ${ar.toFixed(1)}:1`, 0]);
  if (pad > .3) f.push(['padded', `${Math.round(pad * 100)}% padding`, 0]);
  if (!stn.streams.length) f.push(['nostream', 'No streams', 1]);
  if (stn.streams.length >= 5) f.push(['many', `${stn.streams.length} streams`, 0]);
  if (stn.streams.some(s => s.name.length > 30)) f.push(['long', 'Long feed name', 0]);
  if (stn.streams.some(s => s.custom)) f.push(['custom', 'Custom stream logo', 0]);
  if (stn.sample) f.push(['sample', 'Sample (not in radio data)', 0]);
  return f;
}
const FILTERS = [['all', 'All'], ['nowhite', 'No white logo'], ['dark', 'Logo not light'], ['wide', 'Wide logo'], ['compact', 'Compact logo'], ['padded', 'Padded logo'], ['many', '5+ streams'], ['long', 'Long feed name'], ['custom', 'Custom stream logo'], ['nostream', 'No streams']];
const labList = () => S.lab.filter === 'all' ? LAB : LAB.filter(s => flagsOf(s).some(f => f[0] === S.lab.filter));
const flagHtml = (stn) => flagsOf(stn).map(f => `<span class="flag ${f[2] ? 'warn' : ''}">${f[1]}</span>`).join('') || '<span class="flag ok">No issues</span>';

/* ---------- bottom player ---------- */
function barLines(st) {
  const n = nowOf(st), tz = tzOf(st), status = P.status;
  let l1 = n.title, l2 = n.track ? n.sub : (n.none ? st.freq : (n.next ? `Next: ${n.next.t} at ${fmtS(n.next.s, tz)}` : st.freq));
  switch (status) {
    case 'offline': l1 = 'Stream offline'; l2 = 'Try again in a few minutes'; break;
    case 'paused-video': l2 = 'Paused while video plays'; break;
    case 'connecting': l2 = 'Connecting…'; break;
    case 'ad': l1 = 'Ad break'; l2 = `${st.name} starts after the ad`; break;
    case 'reconnecting': l2 = 'Reconnecting…'; break;
    case 'unsupported': l1 = 'Can’t play in this browser'; l2 = 'Try another browser'; break;
  }

/* video vs audio */
function startVideo(chId, label, navigateTo) {
  const go = () => { if (navigateTo) { V.ch = chId || V.ch; V.playing = true; setPage('livestream'); } else { V.ch = chId || V.ch; V.playing = true; render(); } };
  const audioOn = P.id && (P.status === 'playing' || P.status === 'connecting');
  if (!audioOn) { if (chId === 'vod') { toast('Video would start here (outside this prototype)'); return; } go(); return; }
  const name = byId(P.id).name;
  const apply = () => {
    if (S.opt.av === 'pause') { stopAudioEl(); P.status = 'paused-video'; P.pausedBy = chId; toast(`${name} paused while video plays`); }
    else { stopAudio(true); toast(`Stopped ${name}`); }
    if (chId === 'vod') { render(); return; }
    go();
  };
  if (S.opt.av === 'ask') { dialog = { label, apply }; layer(); return; }
  apply();
}

  let left = r.left - sec.left; const w = Math.min(320, sec.width - 16); pk.style.width = w + 'px';
  if (left + w > sec.width) left = sec.width - w - 8;

let io = null;

function setPage(p) { document.querySelectorAll('#page .tiles,#page .grid-scroll,#page .rcards').forEach(el => el.scrollLeft = 0); S.page = p; P.picker = false; P.hdrPop = false; P.drawer = P.drawer && p === 'livestream'; if (location.hash !== '#' + p) history.replaceState(null, '', '#' + p); document.getElementById('vp').scrollTop = 0; render(); }

/* ---------- events ---------- */
document.addEventListener('click', (e) => {
  const t = e.target.closest('button,[data-expand],input');
  if (t && t.tagName === 'INPUT') return;
  if (P.picker && !e.target.closest('.picker,[data-picker]')) { P.picker = false; render(); if (!t) return; }
  if (P.hdrPop && !e.target.closest('.hdr-pop,[data-hdr]')) { P.hdrPop = false; render(); if (!t) return; }
  if (P.navPop && !e.target.closest('.nm')) { P.navPop = false; render(); if (!t) return; }
  if (P.npSw && !e.target.closest('.b-np-swrap')) { P.npSw = false; render(); if (!t) return; }
  if (!t) return;
  const d = t.dataset;
  if (d.page) return setPage(d.page);
  if (d.lab && t.tagName !== 'INPUT') {
    const L = S.lab, list = labList(), i = list.findIndex(s => s.call === L.call);
    switch (d.lab) {
      case 'mode': L.mode = d.val; break;
      case 'prev': L.call = list[(i - 1 + list.length) % list.length].call; L.stream = 0; break;
      case 'next': L.call = list[(i + 1) % list.length].call; L.stream = 0; break;
      case 'filter': L.filter = d.val; break;
      case 'stream': L.stream = +d.val; break;
      case 'pick': L.pick = d.val; break;
      case 'open': L.call = d.val; L.mode = 'station'; L.stream = 0; document.getElementById('vp').scrollTop = 0; break;

  if (d.shiftdemo) { if (!P.id || !isPlaying(P.id)) { toast('Start a stream with a schedule first'); return; } if (P.shift) { P.shift = 0; } else { const n = nowOf(byId(P.id)); if (!n.next) { toast('This stream has no next program listed'); return; } P.shift = n.next.s - NOW + 60000; } P.swapUntil = Date.now() + 900; return render(); }
  if (d.scen) { S.scen[d.scen] = d.scen === 'streams' ? +d.val : d.val; save(); if (P.id && !streamsFor(byId(P.id).station).some(s => s.id === P.id)) stopAudio(true); return render(); }

  if (d.navradio) { if (S.device === 'mobile') { P.navPop = !P.navPop; return render(); } return goRadio(); }
  if (d.goradio) return goRadio();

  if (d.picker) { P.picker = !P.picker; return render(); }
  if (d.npsw) { P.npSw = !P.npSw; return render(); }
  if (d.hdr) { P.hdrPop = !P.hdrPop; return render(); }
  if (d.mute) { P.vol = P.vol ? 0 : (P.lastVol || 0.8); if (P.vol) P.lastVol = P.vol; audC.volume = audP.volume = P.vol; return bottomPlayer(); }
  if (d.wsel) { const cur = d.wsel; if (P.id && byId(P.id).station === 'WTJX' && isPlaying(P.id)) startAudio(cur); else { P.id = cur; P.status = 'idle'; render(); } return; }
  if (d.play) { e.preventDefault(); return togglePlay(d.play, !!d.switch); }

  if (d.closebar) { stopAudio(true); return; }
  if (d.closedrawer) { P.drawer = false; return layer(); }
  if (d.tv) { const ch = TVALL.find(c => c.id === d.tv); return startVideo(d.tv, ch.name, true); }
  if (d.watchtv) { const ch = TVALL.find(c => c.id === d.watchtv) || TV.find(c => c.id === d.watchtv); return startVideo(d.watchtv, ch.name, S.page !== 'livestream' && !embedOn()); }
  if (d.watch) return startVideo('vod', 'Crime and Punishment in America', false);

// resume from "paused while video plays"
document.addEventListener('click', (e) => { const b = e.target.closest('.bp-play'); if (b && P.status === 'paused-video') { /* handled by togglePlay: status isn't playing, so it restarts */ } }, true);

});
document.addEventListener('input', (e) => { if (e.target.id === 'vol') { P.vol = +e.target.value; if (P.vol) P.lastVol = P.vol; audC.volume = audP.volume = P.vol; } });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { if (dialog) { dialog = null; layer(); } else if (P.picker || P.hdrPop || P.navPop || P.npSw) { P.picker = P.hdrPop = P.navPop = P.npSw = false; render(); } else if (P.expanded) { P.expanded = false; bottomPlayer(); } } });
window.addEventListener('hashchange', () => { const p = pageFromHash(); if (p !== S.page) setPage(p); });
